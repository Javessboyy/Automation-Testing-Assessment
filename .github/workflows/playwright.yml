name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run Playwright tests
      id: playwright
      run: npx playwright test --project=${{ matrix.browser }}
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results-${{ matrix.browser }}
        path: allure-results/
        retention-days: 30
    - name: Fail workflow if tests failed
      if: steps.playwright.outcome == 'failure'
      run: exit 1

  report:
    needs: test
    if: ${{ always() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_S4jbJc0ONAlejOQWWSoqZ4ZS
      VERCEL_PROJECT_ID: prj_5tKz5QUa9maxQMEAOSCkFmppPLAZ
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Download allure results
      uses: actions/download-artifact@v4
      with:
        pattern: allure-results-*
        path: allure-results
        merge-multiple: true
    - name: Generate Allure report
      run: npx allure generate allure-results --clean -o allure-report
    - name: Deploy Allure report to Vercel
      if: ${{ github.event_name == 'push' }}
      working-directory: allure-report
      run: |
        npm install -g vercel
        vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
