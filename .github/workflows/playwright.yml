name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_S4jbJc0ONAlejOQWWSoqZ4ZS
      VERCEL_PROJECT_ID: prj_5tKz5QUa9maxQMEAOSCkFmppPLAZ
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      id: playwright
      run: npx playwright test
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npx allure generate allure-results --clean -o allure-report
    - name: Deploy Allure report to Vercel
      if: ${{ !cancelled() && github.event_name == 'push' }}
      working-directory: allure-report
      run: |
        npm install -g vercel
        vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
    - name: Fail workflow if tests failed
      if: steps.playwright.outcome == 'failure'
      run: exit 1
